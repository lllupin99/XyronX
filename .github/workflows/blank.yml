name: Test Minecraft Microsoft Store acquisition

on:
  workflow_dispatch:

jobs:
  test-minecraft-store:
    runs-on: windows-11-arm

    steps:
      - name: System info
        shell: pwsh
        run: |
          Write-Host "OS:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Make sure WinGet exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "PowerShell:"
          $PSVersionTable

          Write-Host "Checking PSResourceGet..."
          Get-Command Install-PSResource -ErrorAction Stop

          Write-Host "Installing official Microsoft WinGet PowerShell client..."
          Install-PSResource `
            -Name Microsoft.WinGet.Client `
            -Repository PSGallery `
            -TrustRepository `
            -Reinstall

          Import-Module Microsoft.WinGet.Client

          Write-Host "Installing/repairing WinGet..."
          Repair-WinGetPackageManager -Latest -Force

          $wingetLinks = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links"
          $env:Path = "$wingetLinks;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $wingetLinks

          Write-Host "WinGet version:"
          winget --version

          Write-Host "WinGet sources:"
          winget source list

      - name: Check Minecraft in Microsoft Store
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== MICROSOFT STORE CATALOG TEST ==="

          winget show 9NBLGGH2JHXJ `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host "Exit code: $LASTEXITCODE"

      - name: Test official Minecraft download
        shell: pwsh
        continue-on-error: true
        run: |
          $out = "$env:RUNNER_TEMP\minecraft-store-test"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Write-Host "=== MICROSOFT OFFICIAL DOWNLOAD TEST ==="

          winget download `
            --id 9NBLGGH2JHXJ `
            --source msstore `
            --skip-license `
            --architecture x64 `
            --platform Windows.Desktop `
            --download-directory $out `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity `
            --verbose-logs

          $exit = $LASTEXITCODE

          Write-Host ""
          Write-Host "=== RESULT ==="
          Write-Host "WinGet exit code: $exit"

          Write-Host ""
          Write-Host "=== FILES DOWNLOADED ==="

          if (Test-Path $out) {
            Get-ChildItem $out -Recurse | Select-Object FullName, Length
          }

          Write-Host ""
          Write-Host "=== TOTAL SIZE ==="

          if (Test-Path $out) {
            $size = (
              Get-ChildItem $out -Recurse -File |
              Measure-Object Length -Sum
            ).Sum

            Write-Host "$size bytes"
          }

          exit 0
