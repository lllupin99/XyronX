name: Test Minecraft Microsoft Store acquisition

on:
  workflow_dispatch:

jobs:
  test-minecraft-store:
    runs-on: windows-11-arm

    steps:
      - name: System info
        shell: pwsh
        run: |
          Write-Host "=== SYSTEM ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host ""
          Write-Host "=== REGION / LOCALE ==="
          Get-Culture
          Get-WinSystemLocale
          Get-WinHomeLocation

      - name: Install and verify WinGet
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== POWERSHELL ==="
          $PSVersionTable

          Write-Host ""
          Write-Host "=== INSTALL PSRESOURCE MODULE ==="

          Get-Command Install-PSResource -ErrorAction Stop

          Install-PSResource `
            -Name Microsoft.WinGet.Client `
            -Repository PSGallery `
            -TrustRepository `
            -Reinstall

          Import-Module Microsoft.WinGet.Client

          Write-Host ""
          Write-Host "=== INSTALL / REPAIR WINGET ==="

          Repair-WinGetPackageManager -Latest -Force

          $wingetLinks = Join-Path `
            $env:LOCALAPPDATA `
            "Microsoft\WinGet\Links"

          $env:Path = "$wingetLinks;$env:Path"
          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $wingetLinks

          Write-Host ""
          Write-Host "=== WINGET VERSION ==="
          winget --version

          Write-Host ""
          Write-Host "=== WINGET INFO ==="
          winget --info

          Write-Host ""
          Write-Host "=== SOURCES ==="
          winget source list

          Write-Host ""
          Write-Host "=== UPDATE SOURCES ==="

          winget source update `
            --disable-interactivity

      - name: Verify Microsoft Store source works
        shell: pwsh
        run: |
          Write-Host "=== BASELINE MICROSOFT STORE SEARCH ==="
          Write-Host "Searching for Windows Terminal..."

          winget search "Windows Terminal" `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          $exit = $LASTEXITCODE

          Write-Host ""
          Write-Host "Baseline exit code: $exit"

          if ($exit -ne 0) {
            Write-Host ""
            Write-Host "BASELINE_MSSTORE_TEST=FAIL"
            exit 1
          }

          Write-Host ""
          Write-Host "BASELINE_MSSTORE_TEST=PASS"

      - name: Search Minecraft in Microsoft Store
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host "SEARCH 1: Minecraft"
          Write-Host "================================="

          winget search "Minecraft" `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "================================="
          Write-Host "SEARCH 2: Minecraft for Windows"
          Write-Host "================================="

          winget search "Minecraft for Windows" `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "================================="
          Write-Host "SEARCH 3: STORE ID"
          Write-Host "9NBLGGH2JHXJ"
          Write-Host "================================="

          winget search "9NBLGGH2JHXJ" `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host "Exit code: $LASTEXITCODE"

          exit 0

      - name: Show Minecraft package details
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host "SHOW BY STORE ID"
          Write-Host "================================="

          winget show "9NBLGGH2JHXJ" `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "================================="
          Write-Host "SHOW BY NAME"
          Write-Host "================================="

          winget show "Minecraft for Windows" `
            --source msstore `
            --accept-source-agreements `
            --disable-interactivity

          Write-Host "Exit code: $LASTEXITCODE"

          exit 0

      - name: Test official Minecraft download
        shell: pwsh
        run: |
          $out = Join-Path `
            $env:RUNNER_TEMP `
            "minecraft-store-test"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out |
            Out-Null

          Write-Host "================================="
          Write-Host "MICROSOFT OFFICIAL DOWNLOAD TEST"
          Write-Host "================================="

          winget download `
            --id 9NBLGGH2JHXJ `
            --source msstore `
            --skip-license `
            --architecture x64 `
            --platform Windows.Desktop `
            --download-directory $out `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity `
            --verbose-logs

          $exit = $LASTEXITCODE

          Write-Host ""
          Write-Host "WinGet exit code: $exit"

          Write-Host ""
          Write-Host "=== FILES DOWNLOADED ==="

          $files = Get-ChildItem `
            $out `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($files) {
            $files |
              Select-Object FullName, Length

            $size = (
              $files |
              Measure-Object Length -Sum
            ).Sum

            Write-Host ""
            Write-Host "TOTAL DOWNLOADED SIZE:"
            Write-Host "$size bytes"

            Write-Host ""
            Write-Host "MICROSOFT_MINECRAFT_DOWNLOAD=FILES_PRESENT"
          }
          else {
            Write-Host "No files downloaded."
            Write-Host "MICROSOFT_MINECRAFT_DOWNLOAD=NO_FILES"
          }

          exit 0

      - name: Final result
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host "MICROSOFT STORE TEST COMPLETE"
          Write-Host "================================="
