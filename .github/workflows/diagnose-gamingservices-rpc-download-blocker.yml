name: Diagnose GamingServices RPC download blocker

on:
  workflow_dispatch:
    inputs:
      accept_launcher_eula:
        description: "I accept the official Minecraft Launcher EULA and allow one install attempt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose-rpc-download:
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      INSTALLER_URL: https://aka.ms/minecraftClientGameCoreWindows
      LAUNCHER_PFN: Microsoft.4297127D64EC6_8wekyb3d8bbwe

    steps:
      - name: Diagnose RPC, firewall, delivery optimization, and Store services
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== SYSTEM ==='
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | Format-List

          Write-Host '=== CRITICAL SERVICE STATE ==='
          $serviceNames = @(
            'RpcEptMapper','RpcSs','DcomLaunch','BFE','MpsSvc','DoSvc','BITS',
            'wuauserv','InstallService','UsoSvc','AppXSvc','ClipSVC'
          )
          foreach ($name in $serviceNames) {
            $svc = Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction SilentlyContinue
            if ($svc) {
              Write-Host "SERVICE=$name STATE=$($svc.State) STARTMODE=$($svc.StartMode) PATH=$($svc.PathName)"
            } else {
              Write-Host "SERVICE=$name PRESENT=false"
            }
          }

          Write-Host '=== LOCAL RPC ENDPOINT MAPPER ==='
          try {
            $rpc = Test-NetConnection 127.0.0.1 -Port 135 -WarningAction SilentlyContinue
            Write-Host "LOCAL_RPC_135_OK=$($rpc.TcpTestSucceeded)"
          } catch { Write-Host "LOCAL_RPC_135_ERROR=$($_.Exception.Message)" }

          Write-Host '=== FIREWALL PROFILES ==='
          try { Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultInboundAction,DefaultOutboundAction | Format-Table -AutoSize } catch { Write-Host "FIREWALL_PROFILE_ERROR=$($_.Exception.Message)" }

          Write-Host '=== WINHTTP PROXY ==='
          netsh winhttp show proxy

          Write-Host '=== MICROSOFT DOWNLOAD HOSTS ==='
          foreach ($hostName in @(
            'tlu.dl.delivery.mp.microsoft.com',
            'fe3cr.delivery.mp.microsoft.com',
            'sfdataservice.microsoft.com'
          )) {
            Write-Host "--- HOST=$hostName ---"
            try {
              $dns = Resolve-DnsName $hostName -ErrorAction Stop
              Write-Host 'DNS_OK=true'
              $dns | Where-Object { $_.IPAddress } | Select-Object Name,Type,IPAddress | Format-Table -AutoSize
            } catch { Write-Host "DNS_OK=false ERROR=$($_.Exception.Message)" }
            try {
              $tcp = Test-NetConnection $hostName -Port 443 -WarningAction SilentlyContinue
              Write-Host "TCP_443_OK=$($tcp.TcpTestSucceeded) REMOTE=$($tcp.RemoteAddress)"
            } catch { Write-Host "TCP_443_ERROR=$($_.Exception.Message)" }
          }

          Write-Host '=== SAFE START ATTEMPTS FOR STOPPED STANDARD SERVICES ==='
          foreach ($name in @('BFE','MpsSvc','DoSvc','BITS','wuauserv','InstallService')) {
            $svc = Get-Service $name -ErrorAction SilentlyContinue
            if (-not $svc) { continue }
            $cim = Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction SilentlyContinue
            if ($cim.StartMode -eq 'Disabled') {
              Write-Host "SERVICE_START_SKIPPED=$name REASON=Disabled"
              continue
            }
            if ($svc.Status -ne 'Running') {
              try {
                Start-Service $name -ErrorAction Stop
                Start-Sleep -Seconds 1
                $svc.Refresh()
                Write-Host "SERVICE_START_ATTEMPT=$name RESULT=$($svc.Status)"
              } catch {
                Write-Host "SERVICE_START_ATTEMPT=$name ERROR=$($_.Exception.Message)"
              }
            } else {
              Write-Host "SERVICE_ALREADY_RUNNING=$name"
            }
          }

          Write-Host '=== SERVICE STATE AFTER SAFE START ATTEMPTS ==='
          foreach ($name in $serviceNames) {
            $svc = Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction SilentlyContinue
            if ($svc) { Write-Host "SERVICE=$name STATE=$($svc.State) STARTMODE=$($svc.StartMode)" }
          }

      - name: Download and verify official Minecraft installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MinecraftInstaller.exe'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -MaximumRedirection 10
          $sig = Get-AuthenticodeSignature $installer
          $item = Get-Item $installer
          Write-Host "INSTALLER_PATH=$installer"
          Write-Host "INSTALLER_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          Write-Host "SIGNATURE_STATUS=$($sig.Status)"
          Write-Host "SIGNER=$($sig.SignerCertificate.Subject)"
          Write-Host "FILE_VERSION=$($item.VersionInfo.FileVersion)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft Authenticode verification failed.'
          }
          "INSTALLER_PATH=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Reproduce official install attempt and capture exact download result
        shell: pwsh
        env:
          ACCEPT_LAUNCHER_EULA: ${{ inputs.accept_launcher_eula }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:ACCEPT_LAUNCHER_EULA -ne 'true') {
            Write-Host 'INSTALL_ATTEMPT_SKIPPED=true'
            exit 0
          }

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          function Get-Elements([int]$processId) {
            try {
              $root=[System.Windows.Automation.AutomationElement]::RootElement
              $condition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$processId)
              $collection=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
              $items=@()
              for($i=0;$i -lt $collection.Count;$i++) {
                $el=$collection.Item($i)
                try {
                  $items += [pscustomobject]@{ Element=$el; Name=$el.Current.Name; AutomationId=$el.Current.AutomationId; ControlType=$el.Current.ControlType.ProgrammaticName; Enabled=$el.Current.IsEnabled }
                } catch {}
              }
              return $items
            } catch { return @() }
          }

          $start=Get-Date
          "TRACE_START_UTC=$($start.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          Write-Host "TRACE_START_UTC=$($start.ToUniversalTime().ToString('o'))"
          Write-Host 'STORE_SIGN_IN_AUTOMATION=false'
          Write-Host 'EULA_CONSENT_CONFIRMED_BY_WORKFLOW_INPUT=true'

          $proc=Start-Process -FilePath $env:INSTALLER_PATH -PassThru
          Write-Host "INSTALLER_PID=$($proc.Id)"

          $checkbox=$null
          for($attempt=1;$attempt -le 12;$attempt++) {
            Start-Sleep -Seconds 5
            if($proc.HasExited){break}
            $items=Get-Elements $proc.Id
            $checkbox=$items | Where-Object { $_.AutomationId -eq 'AgreementCheckbox' -and $_.ControlType -eq 'ControlType.CheckBox' } | Select-Object -First 1
            Write-Host "UI_WAIT_ATTEMPT=$attempt ELEMENTS=$($items.Count) CHECKBOX_FOUND=$([bool]$checkbox)"
            if($checkbox){break}
          }
          if(-not $checkbox){ Write-Host 'EULA_CHECKBOX_FOUND=false'; exit 0 }

          $toggleObj=$null
          if($checkbox.Element.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern,[ref]$toggleObj)) {
            $toggle=[System.Windows.Automation.TogglePattern]$toggleObj
            if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
          }
          Start-Sleep -Seconds 3

          $items=Get-Elements $proc.Id
          $install=$items | Where-Object { $_.AutomationId -eq 'ContinueButton' -and $_.ControlType -eq 'ControlType.Button' -and $_.Enabled } | Select-Object -First 1
          if(-not $install){ Write-Host 'INSTALL_BUTTON_READY=false'; exit 0 }
          $invokeObj=$null
          if($install.Element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$invokeObj)) {
            ([System.Windows.Automation.InvokePattern]$invokeObj).Invoke()
            Write-Host 'INSTALL_BUTTON_INVOKED=true'
          }

          $deadline=(Get-Date).AddMinutes(5)
          while((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $gs=Get-AppxPackage -AllUsers -Name Microsoft.GamingServices -ErrorAction SilentlyContinue | Select-Object -First 1
            if($gs){ Write-Host "GAMING_SERVICES_PRESENT=$($gs.PackageFullName)" }
            $launcher=Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue | Where-Object { $_.PackageFamilyName -eq $env:LAUNCHER_PFN } | Select-Object -First 1
            if($launcher){ Write-Host "LAUNCHER_INSTALLED=true PACKAGE=$($launcher.PackageFullName)"; break }
            if($proc.HasExited){ Write-Host "INSTALLER_EXITED=true CODE=$($proc.ExitCode)"; break }
          }
          $launcher=Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue | Where-Object { $_.PackageFamilyName -eq $env:LAUNCHER_PFN } | Select-Object -First 1
          if(-not $launcher){ Write-Host 'LAUNCHER_INSTALLED=false' }

      - name: Summarize RPC and Windows Update failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $start=[DateTime]::Parse($env:TRACE_START_UTC).ToLocalTime()

          Write-Host '=== WINDOWS UPDATE DOWNLOAD ERRORS ==='
          try {
            Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-WindowsUpdateClient/Operational';StartTime=$start} -ErrorAction Stop |
              Where-Object { $_.Id -eq 31 } |
              Select-Object -First 40 |
              ForEach-Object {
                [xml]$xml=$_.ToXml()
                $data=@{}
                foreach($d in $xml.Event.EventData.Data){$data[$d.Name]=$d.'#text'}
                Write-Host "WU_ERROR TITLE=$($data['updateTitle']) CODE=$($data['errorCode']) GUID=$($data['updateGuid'])"
              }
          } catch { Write-Host "WU_EVENT_ERROR=$($_.Exception.Message)" }

          Write-Host '=== MERGED WINDOWS UPDATE ERROR CONTEXT ==='
          $wu=Join-Path $env:RUNNER_TEMP 'WindowsUpdate.log'
          try {
            Get-WindowsUpdateLog -LogPath $wu | Out-Null
            if(Test-Path $wu) {
              Select-String -Path $wu -Pattern '800706D9|tlu\.dl\.delivery\.mp\.microsoft\.com|GDRHelper|StartProductInstallWithOptionsAsync|Failed to get the download volume' -CaseSensitive:$false |
                Select-Object -Last 160 |
                ForEach-Object { Write-Host "WU_LOG=$($_.Line)" }
            }
          } catch { Write-Host "WINDOWS_UPDATE_LOG_ERROR=$($_.Exception.Message)" }

          Write-Host '=== FINAL CRITICAL SERVICES ==='
          foreach($name in @('RpcEptMapper','RpcSs','DcomLaunch','BFE','MpsSvc','DoSvc','BITS','wuauserv','InstallService','UsoSvc')) {
            $svc=Get-CimInstance Win32_Service -Filter "Name='$name'" -ErrorAction SilentlyContinue
            if($svc){Write-Host "SERVICE=$name STATE=$($svc.State) STARTMODE=$($svc.StartMode)"}
          }

          Write-Host '=== FINAL TLU HOST CHECK ==='
          try { $dns=Resolve-DnsName 'tlu.dl.delivery.mp.microsoft.com' -ErrorAction Stop; Write-Host 'TLU_DNS_OK=true'; $dns | Where-Object {$_.IPAddress} | Select-Object Name,Type,IPAddress | Format-Table -AutoSize } catch { Write-Host "TLU_DNS_OK=false ERROR=$($_.Exception.Message)" }
          try { $tcp=Test-NetConnection 'tlu.dl.delivery.mp.microsoft.com' -Port 443 -WarningAction SilentlyContinue; Write-Host "TLU_TCP_443_OK=$($tcp.TcpTestSucceeded) REMOTE=$($tcp.RemoteAddress)" } catch { Write-Host "TLU_TCP_ERROR=$($_.Exception.Message)" }

          Get-Process -Name MinecraftInstaller,GamingRepair -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'FINAL_RESULT=RPC/download blocker diagnostic completed; only standard Microsoft services were started when already enabled, no Microsoft sign-in was automated, and no package payload was uploaded.'
