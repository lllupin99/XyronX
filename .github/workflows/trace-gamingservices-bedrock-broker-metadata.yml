name: Trace GamingServices Bedrock broker metadata

on:
  workflow_dispatch:
    inputs:
      accept_launcher_eula:
        description: "I accept the official Minecraft Launcher EULA and allow one install attempt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  trace-bedrock-broker:
    runs-on: windows-11-arm
    timeout-minutes: 8
    env:
      INSTALLER_URL: https://aka.ms/minecraftClientGameCoreWindows
      GAMING_SERVICES_NAME: Microsoft.GamingServices
      BEDROCK_PRODUCT_ID: 9NBLGGH2JHXJ

    steps:
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MinecraftInstaller.exe'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -MaximumRedirection 10
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft Authenticode verification failed.'
          }
          Write-Host "INSTALLER_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          Write-Host "SIGNATURE_STATUS=$($sig.Status)"
          "INSTALLER_PATH=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Materialize Gaming Services only
        shell: pwsh
        env:
          ACCEPT_LAUNCHER_EULA: ${{ inputs.accept_launcher_eula }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:ACCEPT_LAUNCHER_EULA -ne 'true') {
            Write-Host 'INSTALL_ATTEMPT_SKIPPED=true'
            exit 0
          }

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          function Get-Elements([int]$processId) {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $condition = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
                $processId
              )
              $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              $result = @()
              for ($i = 0; $i -lt $all.Count; $i++) {
                $element = $all.Item($i)
                try {
                  $result += [pscustomobject]@{
                    Element = $element
                    Id = $element.Current.AutomationId
                    Type = $element.Current.ControlType.ProgrammaticName
                    Enabled = $element.Current.IsEnabled
                  }
                } catch {}
              }
              return $result
            } catch {
              return @()
            }
          }

          Write-Host 'STORE_SIGN_IN_AUTOMATION=false'
          Write-Host 'EULA_CONSENT_CONFIRMED_BY_WORKFLOW_INPUT=true'
          $proc = Start-Process -FilePath $env:INSTALLER_PATH -PassThru

          $checkbox = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            Start-Sleep -Seconds 5
            if ($proc.HasExited) { break }
            $elements = Get-Elements $proc.Id
            $checkbox = $elements |
              Where-Object { $_.Id -eq 'AgreementCheckbox' -and $_.Type -eq 'ControlType.CheckBox' } |
              Select-Object -First 1
            Write-Host "UI_WAIT_ATTEMPT=$attempt ELEMENTS=$($elements.Count) CHECKBOX_FOUND=$([bool]$checkbox)"
            if ($checkbox) { break }
          }

          if (-not $checkbox) {
            Write-Host 'EULA_CHECKBOX_FOUND=false'
            exit 0
          }

          $pattern = $null
          if ($checkbox.Element.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern, [ref]$pattern)) {
            $toggle = [System.Windows.Automation.TogglePattern]$pattern
            if ($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off) {
              $toggle.Toggle()
            }
          }

          Start-Sleep -Seconds 3
          $elements = Get-Elements $proc.Id
          $button = $elements |
            Where-Object { $_.Id -eq 'ContinueButton' -and $_.Type -eq 'ControlType.Button' -and $_.Enabled } |
            Select-Object -First 1

          if (-not $button) {
            Write-Host 'INSTALL_BUTTON_READY=false'
            exit 0
          }

          $pattern = $null
          if ($button.Element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pattern)) {
            ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
            Write-Host 'INSTALL_BUTTON_INVOKED=true'
          }

          $gs = $null
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $gs = Get-AppxPackage -AllUsers -Name $env:GAMING_SERVICES_NAME -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($gs) { break }
            if ($proc.HasExited) { break }
          }

          if (-not $gs) {
            Write-Host 'GAMING_SERVICES_PRESENT=false'
            exit 0
          }

          Write-Host "GAMING_SERVICES_PRESENT=true PACKAGE=$($gs.PackageFullName)"
          "GAMING_SERVICES_ROOT=$($gs.InstallLocation)" | Out-File $env:GITHUB_ENV -Append
          Get-Process -Name MinecraftInstaller,GamingRepair -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Extract Bedrock ID context and WinRT broker metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:GAMING_SERVICES_ROOT) {
            Write-Host 'STATIC_TRACE_AVAILABLE=false'
            exit 0
          }

          $root = $env:GAMING_SERVICES_ROOT
          $gs = Join-Path $root 'gamingservices.dll'
          $winmd = Join-Path $root 'microsoft.gameplatform.services.winmd'
          Write-Host 'STATIC_TRACE_AVAILABLE=true'

          if (-not (Test-Path $gs)) {
            Write-Host 'GAMINGSERVICES_DLL_PRESENT=false'
            exit 0
          }

          $bytes = [System.IO.File]::ReadAllBytes($gs)
          $asciiText = [System.Text.Encoding]::Latin1.GetString($bytes)
          $utf16Text = [System.Text.Encoding]::Unicode.GetString($bytes)

          function Write-StringHits([string]$label, [string]$text, [string]$needle, [int]$byteScale) {
            $position = 0
            $count = 0
            while ($position -lt $text.Length) {
              $index = $text.IndexOf($needle, $position, [System.StringComparison]::OrdinalIgnoreCase)
              if ($index -lt 0) { break }
              $count++
              $start = [Math]::Max(0, $index - 160)
              $length = [Math]::Min($text.Length - $start, $needle.Length + 320)
              $context = $text.Substring($start, $length)
              $context = [regex]::Replace($context, '[^\x20-\x7E]+', ' ')
              $context = [regex]::Replace($context, '\s+', ' ').Trim()
              $byteOffset = $index * $byteScale
              Write-Host "$label HIT=$count OFFSET=0x$($byteOffset.ToString('X')) CONTEXT=$($context.Substring(0, [Math]::Min(700, $context.Length)))"
              $position = $index + [Math]::Max(1, $needle.Length)
            }
            Write-Host "$label`_COUNT=$count"
          }

          Write-Host '=== BEDROCK PRODUCT ID CONTEXT ==='
          Write-StringHits 'BEDROCK_ID_ASCII' $asciiText $env:BEDROCK_PRODUCT_ID 1
          Write-StringHits 'BEDROCK_ID_UTF16LE' $utf16Text $env:BEDROCK_PRODUCT_ID 2

          Write-Host '=== FOCUSED SYMBOL PRESENCE ==='
          $symbols = @(
            'StartProductInstallWithOptionsAsync',
            'StartProductInstall',
            'StoreContext',
            'XStore',
            'Entitlement',
            'MSIXVC',
            'PackageRequest',
            'PackageQueue',
            'PackageSpecifier',
            'ContentAccess',
            'ClipGetLicenseData',
            'ClipInstallLicense'
          )

          foreach ($symbol in $symbols) {
            $asciiIndex = $asciiText.IndexOf($symbol, [System.StringComparison]::OrdinalIgnoreCase)
            $utf16Index = $utf16Text.IndexOf($symbol, [System.StringComparison]::OrdinalIgnoreCase)
            $asciiResult = if ($asciiIndex -ge 0) { "ASCII@0x$($asciiIndex.ToString('X'))" } else { 'ASCII=NONE' }
            $utf16Result = if ($utf16Index -ge 0) { "UTF16LE@0x$(($utf16Index * 2).ToString('X'))" } else { 'UTF16LE=NONE' }
            Write-Host "SYMBOL=$symbol $asciiResult $utf16Result"
          }

          Write-Host '=== WINMD TYPES AND METHODS ==='
          try { Add-Type -AssemblyName System.Reflection.Metadata } catch {}
          try { Add-Type -AssemblyName System.Collections.Immutable } catch {}

          if (Test-Path $winmd) {
            $stream = [System.IO.File]::OpenRead($winmd)
            $pe = $null
            try {
              $pe = [System.Reflection.PortableExecutable.PEReader]::new($stream)
              $reader = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($pe)
              foreach ($handle in $reader.TypeDefinitions) {
                $typeDef = $reader.GetTypeDefinition($handle)
                $namespace = $reader.GetString($typeDef.Namespace)
                $name = $reader.GetString($typeDef.Name)
                $fullName = if ($namespace) { "$namespace.$name" } else { $name }

                if ($fullName -match '^Microsoft\.GamePlatform\.Services\.(Store|Licensing|PackageRequest|PackageQueue|PackageSpecifier|ContentAccess|PackageSource|Identity\.(TokenRequest|XboxAuthManager))') {
                  Write-Host "TYPE=$fullName"
                  foreach ($methodHandle in $typeDef.GetMethods()) {
                    $method = $reader.GetMethodDefinition($methodHandle)
                    Write-Host "METHOD=$fullName::$($reader.GetString($method.Name))"
                  }
                  foreach ($propertyHandle in $typeDef.GetProperties()) {
                    $property = $reader.GetPropertyDefinition($propertyHandle)
                    Write-Host "PROPERTY=$fullName::$($reader.GetString($property.Name))"
                  }
                }
              }
            } catch {
              Write-Host "WINMD_METADATA_ERROR=$($_.Exception.Message)"
            } finally {
              if ($pe) { $pe.Dispose() }
              $stream.Dispose()
            }
          } else {
            Write-Host 'WINMD_PRESENT=false'
          }

          Write-Host '=== GAMINGSERVICES LICENSING IMPORTS ==='
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Filter dumpbin.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            & $dumpbin.FullName /imports $gs 2>$null |
              Select-String -Pattern 'CLIPC|ClipGet|ClipInstall|ClipGenerate|combase|FindStoreIdForPackage|GetPackageForStoreId|RegisterPackage|WINHTTP|RPCRT4' -CaseSensitive:$false |
              Select-Object -First 120 |
              ForEach-Object { Write-Host "IMPORT=$($_.Line.Trim())" }
          } else {
            Write-Host 'DUMPBIN_AVAILABLE=false'
          }

          Write-Host 'FINAL_RESULT=Static Bedrock broker metadata trace completed; no Store call was invoked and no licensing state was modified by this trace.'
