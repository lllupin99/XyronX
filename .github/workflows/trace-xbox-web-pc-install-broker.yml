name: Trace Xbox web PC install broker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-pc-install-broker:
    runs-on: windows-11-arm

    steps:
      - name: Prepare Edge and workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )

          $edge = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $edge) { throw "Microsoft Edge not found." }

          $root = Join-Path $env:RUNNER_TEMP "xbox-pc-install-broker"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          "EDGE_PATH=$edge" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STATIC_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "EDGE_PATH=$edge"
          Write-Host "STATIC_ROOT=$root"

      - name: Collect current public Xbox JavaScript bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:STATIC_ROOT

          npm init -y | Out-Null
          npm install playwright-core | Out-Null

          @'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.EDGE_PATH,
            headless: true
          });
          const context = await browser.newContext({ locale: 'en-US' });
          const page = await context.newPage();
          const seen = new Set();

          page.on('request', request => {
            const url = request.url();
            if (/^https:\/\/assets-xbxweb\.xbox\.com\/xbox-web\/static\/js\/.*\.js(?:\?.*)?$/i.test(url)) {
              seen.add(url);
            }
          });

          const requested = 'https://apps.microsoft.com/detail/9PGW18NPBZV5?hl=en-US&gl=US';
          console.log(`PAGE_REQUESTED=${requested}`);
          const response = await page.goto(requested, { waitUntil: 'domcontentloaded', timeout: 60000 });
          console.log(`HTTP_STATUS=${response ? response.status() : 'NO_RESPONSE'}`);
          await page.waitForTimeout(10000);
          console.log(`FINAL_URL=${page.url()}`);

          const domScripts = await page.locator('script[src]').evaluateAll(nodes => nodes.map(n => n.src).filter(Boolean));
          for (const url of domScripts) {
            if (/^https:\/\/assets-xbxweb\.xbox\.com\/xbox-web\/static\/js\/.*\.js(?:\?.*)?$/i.test(url)) seen.add(url);
          }

          const urls = [...seen].sort();
          console.log(`BUNDLE_COUNT=${urls.length}`);
          fs.writeFileSync('bundle-urls.json', JSON.stringify(urls, null, 2));

          await context.close();
          await browser.close();
          '@ | Set-Content -Path (Join-Path $env:STATIC_ROOT "collect.mjs") -Encoding UTF8

          node .\collect.mjs
          Pop-Location

      - name: Download public bundles and pretty print high-signal files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $urls = Get-Content (Join-Path $env:STATIC_ROOT "bundle-urls.json") -Raw | ConvertFrom-Json
          $bundleDir = Join-Path $env:STATIC_ROOT "bundles"
          $prettyDir = Join-Path $env:STATIC_ROOT "pretty"
          New-Item -ItemType Directory -Force -Path $bundleDir,$prettyDir | Out-Null

          foreach ($url in $urls) {
            $uri = [Uri]$url
            $name = [System.IO.Path]::GetFileName($uri.AbsolutePath)
            $target = Join-Path $bundleDir $name
            Invoke-WebRequest -Uri $url -OutFile $target -MaximumRedirection 5
            Write-Host "DOWNLOADED=$name SIZE=$((Get-Item $target).Length)"
          }

          Push-Location $env:STATIC_ROOT
          npm install prettier | Out-Null

          $targets = @(
            Get-ChildItem $bundleDir -File -Filter 'client*.js' -ErrorAction SilentlyContinue
            Get-ChildItem $bundleDir -File -Filter 'core-partner*.js' -ErrorAction SilentlyContinue
            Get-ChildItem $bundleDir -File -Filter 'ProductDetailsPage*.js' -ErrorAction SilentlyContinue
          ) | Sort-Object FullName -Unique

          foreach ($file in $targets) {
            $out = Join-Path $prettyDir $file.Name
            npx prettier $file.FullName --parser babel | Set-Content -Path $out -Encoding UTF8
            Write-Host "PRETTY=$($file.Name) SIZE=$((Get-Item $out).Length)"
          }
          Pop-Location

          "BUNDLE_DIR=$bundleDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRETTY_DIR=$prettyDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Trace install device and queue logic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== PC INSTALL BROKER HIGH-SIGNAL TRACE ==="
          Write-Host "Only public Xbox website JavaScript is being inspected."

          $needles = @(
            'QUEUE_INSTALL',
            'FETCH_DEVICES',
            'queueInstall',
            'fetchDevices',
            'pcDevices',
            'xboxDevices',
            'installOperationsByProductId',
            'EnableRemoteInstallToPc',
            'RemoteManagement',
            'ApplicationNotInstalled',
            'ms-windows-store',
            'msxbox://game',
            'deviceId',
            'operationId',
            'storageDeviceId',
            'oneStoreProductId',
            'Xccs',
            'XCCS',
            'xboxservices.com',
            'xboxcomfd',
            'remoteInstall',
            'installScreenPcAppRequiresText'
          )

          $files = @(Get-ChildItem $env:PRETTY_DIR -File -Filter *.js -ErrorAction SilentlyContinue)
          Write-Host "PRETTY_FILE_COUNT=$($files.Count)"

          foreach ($needle in $needles) {
            Write-Host ""
            Write-Host "===== NEEDLE: $needle ====="
            $shown = 0
            foreach ($file in $files) {
              $matches = @(Select-String -Path $file.FullName -Pattern $needle -SimpleMatch -Context 18,28 -ErrorAction SilentlyContinue)
              foreach ($match in $matches) {
                if ($shown -ge 4) { break }
                Write-Host "--- FILE=$($file.Name) LINE=$($match.LineNumber) ---"
                foreach ($line in $match.Context.PreContext) { Write-Host $line }
                Write-Host ">>> $($match.Line)"
                foreach ($line in $match.Context.PostContext) { Write-Host $line }
                $shown++
              }
              if ($shown -ge 4) { break }
            }
          }

          exit 0

      - name: Extract URL and route candidates near install code
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== URL AND ROUTE CANDIDATES ==="
          $files = @(Get-ChildItem $env:PRETTY_DIR -File -Filter *.js -ErrorAction SilentlyContinue)

          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
            if (-not $text) { continue }

            if ($text -notmatch 'QUEUE_INSTALL|queueInstall|FETCH_DEVICES|pcDevices') { continue }
            Write-Host "--- FILE=$($file.Name) ---"

            $urls = [regex]::Matches($text, 'https?://[^"''`\s)]+') | ForEach-Object { $_.Value } | Sort-Object -Unique
            foreach ($url in $urls | Select-Object -First 120) {
              if ($url -match 'xbox|microsoft|store|emerald|device|install|service') {
                Write-Host "URL=$url"
              }
            }

            $routeMatches = [regex]::Matches($text, '["''][A-Za-z0-9_./{}?-]{3,160}["'']') | ForEach-Object { $_.Value.Trim('"','''') } | Sort-Object -Unique
            foreach ($route in $routeMatches | Where-Object { $_ -match 'device|install|package|product|operation|remote|queue|content' } | Select-Object -First 160) {
              Write-Host "ROUTE_CANDIDATE=$route"
            }
          }

          exit 0

      - name: Final marker
        shell: pwsh
        run: |
          Write-Host "=== XBOX WEB PC INSTALL BROKER TRACE COMPLETE ==="
          Write-Host "No Microsoft account was used."
          Write-Host "No auth token or cookie was captured."
          Write-Host "No install, purchase, entitlement, device, or Store API request was invoked."
          Write-Host "Only JavaScript publicly served by xbox.com was downloaded and statically inspected."
