name: Probe GamingServices WinRT activation boundary

on:
  workflow_dispatch:
    inputs:
      accept_launcher_eula:
        description: "I accept the official Minecraft Launcher EULA and allow one Gaming Services materialization attempt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe-activation:
    runs-on: windows-11-arm
    timeout-minutes: 8
    env:
      INSTALLER_URL: https://aka.ms/minecraftClientGameCoreWindows
      GAMING_SERVICES_NAME: Microsoft.GamingServices

    steps:
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MinecraftInstaller.exe'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -MaximumRedirection 10
          $sig = Get-AuthenticodeSignature $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft Authenticode verification failed.'
          }
          Write-Host "INSTALLER_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          Write-Host "SIGNATURE_STATUS=$($sig.Status)"
          "INSTALLER_PATH=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Materialize Gaming Services only
        shell: pwsh
        env:
          ACCEPT_LAUNCHER_EULA: ${{ inputs.accept_launcher_eula }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:ACCEPT_LAUNCHER_EULA -ne 'true') {
            Write-Host 'INSTALL_ATTEMPT_SKIPPED=true'
            exit 0
          }

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          function Get-Elements([int]$processId) {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $condition = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
                $processId
              )
              $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              $result = @()
              for ($i = 0; $i -lt $all.Count; $i++) {
                $element = $all.Item($i)
                try {
                  $result += [pscustomobject]@{
                    Element = $element
                    Id = $element.Current.AutomationId
                    Type = $element.Current.ControlType.ProgrammaticName
                    Enabled = $element.Current.IsEnabled
                  }
                } catch {}
              }
              return $result
            } catch { return @() }
          }

          Write-Host 'STORE_SIGN_IN_AUTOMATION=false'
          Write-Host 'EULA_CONSENT_CONFIRMED_BY_WORKFLOW_INPUT=true'
          $proc = Start-Process -FilePath $env:INSTALLER_PATH -PassThru

          $checkbox = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            Start-Sleep -Seconds 5
            if ($proc.HasExited) { break }
            $elements = Get-Elements $proc.Id
            $checkbox = $elements |
              Where-Object { $_.Id -eq 'AgreementCheckbox' -and $_.Type -eq 'ControlType.CheckBox' } |
              Select-Object -First 1
            Write-Host "UI_WAIT_ATTEMPT=$attempt ELEMENTS=$($elements.Count) CHECKBOX_FOUND=$([bool]$checkbox)"
            if ($checkbox) { break }
          }
          if (-not $checkbox) {
            Write-Host 'EULA_CHECKBOX_FOUND=false'
            exit 0
          }

          $pattern = $null
          if ($checkbox.Element.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern, [ref]$pattern)) {
            $toggle = [System.Windows.Automation.TogglePattern]$pattern
            if ($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off) {
              $toggle.Toggle()
            }
          }
          Start-Sleep -Seconds 3

          $elements = Get-Elements $proc.Id
          $button = $elements |
            Where-Object { $_.Id -eq 'ContinueButton' -and $_.Type -eq 'ControlType.Button' -and $_.Enabled } |
            Select-Object -First 1
          if (-not $button) {
            Write-Host 'INSTALL_BUTTON_READY=false'
            exit 0
          }

          $pattern = $null
          if ($button.Element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pattern)) {
            ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
            Write-Host 'INSTALL_BUTTON_INVOKED=true'
          }

          $gs = $null
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $gs = Get-AppxPackage -AllUsers -Name $env:GAMING_SERVICES_NAME -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($gs) { break }
            if ($proc.HasExited) { break }
          }
          if (-not $gs) {
            Write-Host 'GAMING_SERVICES_PRESENT=false'
            exit 0
          }

          Write-Host "GAMING_SERVICES_PRESENT=true PACKAGE=$($gs.PackageFullName)"
          "GAMING_SERVICES_ROOT=$($gs.InstallLocation)" | Out-File $env:GITHUB_ENV -Append
          Get-Process -Name MinecraftInstaller,GamingRepair -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Probe WinRT activation only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not $env:GAMING_SERVICES_ROOT) {
            Write-Host 'ACTIVATION_PROBE_AVAILABLE=false'
            exit 0
          }

          Write-Host 'ACTIVATION_PROBE_AVAILABLE=true'
          Write-Host 'NO_STORE_METHODS_INVOKED=true'
          Write-Host 'NO_LICENSE_METHODS_INVOKED=true'
          Write-Host 'NO_PACKAGE_REQUESTS_SUBMITTED=true'

          $sourceLines = @(
            'using System;',
            'using System.Runtime.InteropServices;',
            'public static class WinRtActivationProbe {',
            '  [DllImport("combase.dll")] private static extern int RoInitialize(uint initType);',
            '  [DllImport("combase.dll")] private static extern void RoUninitialize();',
            '  [DllImport("combase.dll", CharSet = CharSet.Unicode)] private static extern int WindowsCreateString(string sourceString, int length, out IntPtr hstring);',
            '  [DllImport("combase.dll")] private static extern int WindowsDeleteString(IntPtr hstring);',
            '  [DllImport("combase.dll")] private static extern int RoGetActivationFactory(IntPtr activatableClassId, ref Guid iid, out IntPtr factory);',
            '  private static readonly Guid IID_IActivationFactory = new Guid("00000035-0000-0000-C000-000000000046");',
            '  public static int Probe(string className) {',
            '    int init = RoInitialize(1);',
            '    IntPtr h = IntPtr.Zero;',
            '    IntPtr factory = IntPtr.Zero;',
            '    try {',
            '      int hr = WindowsCreateString(className, className.Length, out h);',
            '      if (hr < 0) return hr;',
            '      Guid iid = IID_IActivationFactory;',
            '      return RoGetActivationFactory(h, ref iid, out factory);',
            '    } finally {',
            '      if (factory != IntPtr.Zero) Marshal.Release(factory);',
            '      if (h != IntPtr.Zero) WindowsDeleteString(h);',
            '      if (init >= 0) RoUninitialize();',
            '    }',
            '  }',
            '}'
          )
          $source = $sourceLines -join [Environment]::NewLine
          Add-Type -TypeDefinition $source -Language CSharp

          $classes = @(
            'Microsoft.GamePlatform.Services.Store',
            'Microsoft.GamePlatform.Services.Licensing',
            'Microsoft.GamePlatform.Services.PackageRequest',
            'Microsoft.GamePlatform.Services.PackageQueue',
            'Microsoft.GamePlatform.Services.ContentAccess',
            'Microsoft.GamePlatform.Services.Identity.XboxAuthManager'
          )

          foreach ($class in $classes) {
            $hr = [WinRtActivationProbe]::Probe($class)
            $hex = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$hr), 0)
            Write-Host ("ACTIVATION_CLASS={0} HRESULT=0x{1:X8} SUCCESS={2}" -f $class, $hex, ($hr -ge 0))
          }

          Write-Host 'FINAL_RESULT=Activation-boundary probe completed. No Store acquisition, licensing refresh, entitlement mutation, or package submission was performed.'
