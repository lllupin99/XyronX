name: Inspect Minecraft Launcher acquisition path v2

on:
  workflow_dispatch:
    inputs:
      accept_launcher_eula:
        description: "I accept the official Minecraft Launcher EULA and allow one install attempt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect-launcher:
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      INSTALLER_URL: https://aka.ms/minecraftClientGameCoreWindows
      LAUNCHER_PFN: Microsoft.4297127D64EC6_8wekyb3d8bbwe
      BEDROCK_PRODUCT_ID: 9NBLGGH2JHXJ

    steps:
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "MinecraftInstaller.exe"
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -MaximumRedirection 10
          $sig = Get-AuthenticodeSignature $installer
          $item = Get-Item $installer
          Write-Host "INSTALLER_PATH=$installer"
          Write-Host "INSTALLER_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          Write-Host "SIGNATURE_STATUS=$($sig.Status)"
          Write-Host "SIGNER=$($sig.SignerCertificate.Subject)"
          Write-Host "FILE_VERSION=$($item.VersionInfo.FileVersion)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Microsoft Authenticode verification failed."
          }
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Wait for UI, accept EULA, and invoke INSTALL
        shell: pwsh
        env:
          ACCEPT_LAUNCHER_EULA: ${{ inputs.accept_launcher_eula }}
        run: |
          $ErrorActionPreference = "Continue"

          function Get-LauncherPackage {
            Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue |
              Where-Object { $_.PackageFamilyName -eq $env:LAUNCHER_PFN } |
              Select-Object -First 1
          }

          function Stop-Installer {
            Get-Process -Name MinecraftInstaller -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          function Get-Elements([int]$processId) {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $condition = New-Object System.Windows.Automation.PropertyCondition(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
                $processId
              )
              $collection = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              $items = @()
              for ($i = 0; $i -lt $collection.Count; $i++) {
                $el = $collection.Item($i)
                try {
                  $items += [pscustomobject]@{
                    Element = $el
                    Name = $el.Current.Name
                    AutomationId = $el.Current.AutomationId
                    ControlType = $el.Current.ControlType.ProgrammaticName
                    Enabled = $el.Current.IsEnabled
                  }
                } catch {}
              }
              return $items
            } catch {
              return @()
            }
          }

          function Dump-UI([int]$processId, [string]$label) {
            Write-Host "=== UI: $label ==="
            $items = Get-Elements $processId
            Write-Host "UI_ELEMENT_COUNT=$($items.Count)"
            $items | Where-Object { $_.Name -or $_.AutomationId } | Select-Object -First 200 | ForEach-Object {
              $safe = ($_.Name -replace "`r|`n", ' ')
              Write-Host "UI CONTROL=$($_.ControlType) ENABLED=$($_.Enabled) ID=[$($_.AutomationId)] NAME=[$safe]"
            }
            return $items
          }

          if ($env:ACCEPT_LAUNCHER_EULA -ne 'true') {
            Write-Host "INSTALL_ATTEMPT_SKIPPED=true"
            Write-Host "REASON=EULA input was not enabled"
            exit 0
          }

          if (Get-LauncherPackage) {
            Write-Host "LAUNCHER_ALREADY_INSTALLED=true"
            exit 0
          }

          $proc = Start-Process -FilePath $env:INSTALLER_PATH -PassThru
          Write-Host "INSTALLER_PID=$($proc.Id)"
          Write-Host "STORE_SIGN_IN_AUTOMATION=false"
          Write-Host "EULA_CONSENT_CONFIRMED_BY_WORKFLOW_INPUT=true"

          # The WPF installer can take noticeably longer than 10 seconds to expose its UI
          # on a fresh GitHub runner. Poll until the real agreement controls appear.
          $items = @()
          $checkbox = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            Start-Sleep -Seconds 5
            if ($proc.HasExited) {
              Write-Host "INSTALLER_EXITED_WHILE_WAITING=true"
              Write-Host "INSTALLER_EXIT_CODE=$($proc.ExitCode)"
              break
            }
            $items = Get-Elements $proc.Id
            $checkbox = $items | Where-Object {
              $_.AutomationId -eq 'AgreementCheckbox' -and $_.ControlType -eq 'ControlType.CheckBox'
            } | Select-Object -First 1
            Write-Host "UI_WAIT_ATTEMPT=$attempt ELEMENTS=$($items.Count) CHECKBOX_FOUND=$([bool]$checkbox)"
            if ($checkbox) { break }
          }

          if (-not $checkbox) {
            Write-Host "EULA_CHECKBOX_FOUND=false"
            Dump-UI $proc.Id "UI NOT READY AFTER 60 SECONDS" | Out-Null
            Stop-Installer
            exit 0
          }

          Write-Host "EULA_CHECKBOX_FOUND=true"
          try {
            $toggleObj = $null
            if ($checkbox.Element.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern, [ref]$toggleObj)) {
              $toggle = [System.Windows.Automation.TogglePattern]$toggleObj
              Write-Host "EULA_TOGGLE_STATE_BEFORE=$($toggle.Current.ToggleState)"
              if ($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off) {
                $toggle.Toggle()
              }
              Start-Sleep -Seconds 3
              Write-Host "EULA_CHECKBOX_TOGGLED=true"
            }
          } catch {
            Write-Host "EULA_TOGGLE_ERROR=$($_.Exception.Message)"
          }

          $items = Dump-UI $proc.Id "AFTER EULA CONSENT"
          $install = $items | Where-Object {
            $_.AutomationId -eq 'ContinueButton' -and $_.ControlType -eq 'ControlType.Button'
          } | Select-Object -First 1

          if (-not $install) {
            Write-Host "INSTALL_BUTTON_FOUND=false"
          } elseif (-not $install.Enabled) {
            Write-Host "INSTALL_BUTTON_FOUND=true"
            Write-Host "INSTALL_BUTTON_ENABLED=false"
          } else {
            Write-Host "INSTALL_BUTTON_FOUND=true"
            Write-Host "INSTALL_BUTTON_ENABLED=true"
            try {
              $invokeObj = $null
              if ($install.Element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$invokeObj)) {
                ([System.Windows.Automation.InvokePattern]$invokeObj).Invoke()
                Write-Host "INSTALL_BUTTON_INVOKED=true"
              }
            } catch {
              Write-Host "INSTALL_BUTTON_INVOKE_ERROR=$($_.Exception.Message)"
            }
          }

          # Observe Microsoft installer result. Never click Store sign-in controls.
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $pkg = Get-LauncherPackage
            if ($pkg) {
              Write-Host "LAUNCHER_INSTALLED=true"
              Write-Host "LAUNCHER_PACKAGE=$($pkg.PackageFullName)"
              Write-Host "LAUNCHER_INSTALL_LOCATION=$($pkg.InstallLocation)"
              break
            }
            if ($proc.HasExited) {
              Write-Host "INSTALLER_EXITED_AFTER_INSTALL=true"
              Write-Host "INSTALLER_EXIT_CODE=$($proc.ExitCode)"
              break
            }
          }

          if (-not (Get-LauncherPackage)) {
            Write-Host "LAUNCHER_INSTALLED=false"
            if (-not $proc.HasExited) {
              Dump-UI $proc.Id "FINAL BLOCKER" | Out-Null
            }
          }

          Stop-Installer

      - name: Inspect Launcher package if materialized
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $pkg = Get-AppxPackage -AllUsers -ErrorAction SilentlyContinue |
            Where-Object { $_.PackageFamilyName -eq $env:LAUNCHER_PFN } |
            Select-Object -First 1

          Write-Host "=== LAUNCHER PACKAGE INSPECTION ==="
          if (-not $pkg) {
            Write-Host "PACKAGE_INSPECTION_AVAILABLE=false"
            Write-Host "FINAL_RESULT=Launcher package was not materialized on this runner."
            exit 0
          }

          Write-Host "PACKAGE_INSPECTION_AVAILABLE=true"
          Write-Host "PACKAGE_FULL_NAME=$($pkg.PackageFullName)"
          Write-Host "PACKAGE_FAMILY_NAME=$($pkg.PackageFamilyName)"
          Write-Host "VERSION=$($pkg.Version)"
          Write-Host "ARCHITECTURE=$($pkg.Architecture)"
          Write-Host "INSTALL_LOCATION=$($pkg.InstallLocation)"

          Write-Host "=== ACQUISITION STRING TARGETS ==="
          $needles = @(
            $env:BEDROCK_PRODUCT_ID,
            'Microsoft.MinecraftUWP',
            'GamingServices',
            'Microsoft.GamingServices',
            'XStore',
            'StoreContext',
            'AppInstallManager',
            'ms-windows-store',
            'XCCS',
            'MSIXVC',
            'PackageManager',
            'entitlement'
          )

          $rg = Get-Command rg -ErrorAction SilentlyContinue
          if ($rg) {
            foreach ($needle in $needles) {
              Write-Host "--- NEEDLE=$needle ---"
              $matches = & $rg.Source -a -l -F --glob '!*.png' --glob '!*.jpg' --glob '!*.jpeg' --glob '!*.webp' --glob '!*.mp4' --glob '!*.ogg' --glob '!*.wav' -- "$needle" $pkg.InstallLocation 2>$null
              $matches = @($matches | Select-Object -First 80)
              Write-Host "MATCH_FILE_COUNT=$($matches.Count)"
              foreach ($m in $matches) {
                try {
                  $rel = [System.IO.Path]::GetFullPath($m).Substring($pkg.InstallLocation.Length).TrimStart('\\')
                } catch { $rel = $m }
                Write-Host "MATCH_FILE=$rel"
              }
            }
          }

          Write-Host "FINAL_RESULT=Launcher materialized and was inspected in place; no payload was uploaded."
