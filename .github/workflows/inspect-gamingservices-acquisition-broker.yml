name: Inspect GamingServices acquisition broker

on:
  workflow_dispatch:
    inputs:
      accept_launcher_eula:
        description: "I accept the official Minecraft Launcher EULA and allow one install attempt"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect-gamingservices:
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      INSTALLER_URL: https://aka.ms/minecraftClientGameCoreWindows
      GAMING_SERVICES_NAME: Microsoft.GamingServices
      BEDROCK_PRODUCT_ID: 9NBLGGH2JHXJ

    steps:
      - name: Download and verify official Minecraft installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'MinecraftInstaller.exe'
          Invoke-WebRequest -Uri $env:INSTALLER_URL -OutFile $installer -MaximumRedirection 10
          $sig=Get-AuthenticodeSignature $installer
          $item=Get-Item $installer
          Write-Host "INSTALLER_PATH=$installer"
          Write-Host "INSTALLER_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          Write-Host "SIGNATURE_STATUS=$($sig.Status)"
          Write-Host "SIGNER=$($sig.SignerCertificate.Subject)"
          Write-Host "FILE_VERSION=$($item.VersionInfo.FileVersion)"
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Microsoft Authenticode verification failed.'
          }
          "INSTALLER_PATH=$installer" | Out-File $env:GITHUB_ENV -Append

      - name: Materialize Gaming Services through official installer
        shell: pwsh
        env:
          ACCEPT_LAUNCHER_EULA: ${{ inputs.accept_launcher_eula }}
        run: |
          $ErrorActionPreference='Continue'
          if($env:ACCEPT_LAUNCHER_EULA -ne 'true') {
            Write-Host 'INSTALL_ATTEMPT_SKIPPED=true'
            exit 0
          }

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          function Get-Elements([int]$processId) {
            try {
              $root=[System.Windows.Automation.AutomationElement]::RootElement
              $condition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$processId)
              $collection=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition)
              $items=@()
              for($i=0;$i -lt $collection.Count;$i++) {
                $el=$collection.Item($i)
                try { $items += [pscustomobject]@{Element=$el;Name=$el.Current.Name;AutomationId=$el.Current.AutomationId;ControlType=$el.Current.ControlType.ProgrammaticName;Enabled=$el.Current.IsEnabled} } catch {}
              }
              return $items
            } catch { return @() }
          }

          Write-Host 'STORE_SIGN_IN_AUTOMATION=false'
          Write-Host 'EULA_CONSENT_CONFIRMED_BY_WORKFLOW_INPUT=true'
          $proc=Start-Process -FilePath $env:INSTALLER_PATH -PassThru
          Write-Host "INSTALLER_PID=$($proc.Id)"

          $checkbox=$null
          for($attempt=1;$attempt -le 12;$attempt++) {
            Start-Sleep -Seconds 5
            if($proc.HasExited){break}
            $items=Get-Elements $proc.Id
            $checkbox=$items | Where-Object { $_.AutomationId -eq 'AgreementCheckbox' -and $_.ControlType -eq 'ControlType.CheckBox' } | Select-Object -First 1
            Write-Host "UI_WAIT_ATTEMPT=$attempt ELEMENTS=$($items.Count) CHECKBOX_FOUND=$([bool]$checkbox)"
            if($checkbox){break}
          }
          if(-not $checkbox){ Write-Host 'EULA_CHECKBOX_FOUND=false'; exit 0 }

          $toggleObj=$null
          if($checkbox.Element.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern,[ref]$toggleObj)) {
            $toggle=[System.Windows.Automation.TogglePattern]$toggleObj
            if($toggle.Current.ToggleState -eq [System.Windows.Automation.ToggleState]::Off){$toggle.Toggle()}
          }
          Start-Sleep -Seconds 3

          $items=Get-Elements $proc.Id
          $install=$items | Where-Object { $_.AutomationId -eq 'ContinueButton' -and $_.ControlType -eq 'ControlType.Button' -and $_.Enabled } | Select-Object -First 1
          if(-not $install){ Write-Host 'INSTALL_BUTTON_READY=false'; exit 0 }
          $invokeObj=$null
          if($install.Element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$invokeObj)) {
            ([System.Windows.Automation.InvokePattern]$invokeObj).Invoke()
            Write-Host 'INSTALL_BUTTON_INVOKED=true'
          }

          $gs=$null
          $deadline=(Get-Date).AddMinutes(5)
          while((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $gs=Get-AppxPackage -AllUsers -Name $env:GAMING_SERVICES_NAME -ErrorAction SilentlyContinue | Select-Object -First 1
            if($gs) {
              Write-Host "GAMING_SERVICES_PRESENT=true PACKAGE=$($gs.PackageFullName)"
              break
            }
            if($proc.HasExited) {
              Write-Host "INSTALLER_EXITED=true CODE=$($proc.ExitCode)"
              break
            }
          }

          if(-not $gs) {
            Write-Host 'GAMING_SERVICES_PRESENT=false'
            exit 0
          }

          "GAMING_SERVICES_INSTALL_LOCATION=$($gs.InstallLocation)" | Out-File $env:GITHUB_ENV -Append
          "GAMING_SERVICES_PACKAGE_FULL_NAME=$($gs.PackageFullName)" | Out-File $env:GITHUB_ENV -Append

          Get-Process -Name MinecraftInstaller,GamingRepair -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'OFFICIAL_INSTALL_FLOW_STOPPED_AFTER_GAMING_SERVICES_MATERIALIZED=true'

      - name: Inspect Gaming Services package and acquisition clues
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $pkg=Get-AppxPackage -AllUsers -Name $env:GAMING_SERVICES_NAME -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $pkg) {
            Write-Host 'PACKAGE_INSPECTION_AVAILABLE=false'
            exit 0
          }

          $root=$pkg.InstallLocation
          Write-Host 'PACKAGE_INSPECTION_AVAILABLE=true'
          Write-Host "PACKAGE_FULL_NAME=$($pkg.PackageFullName)"
          Write-Host "PACKAGE_FAMILY_NAME=$($pkg.PackageFamilyName)"
          Write-Host "VERSION=$($pkg.Version)"
          Write-Host "ARCHITECTURE=$($pkg.Architecture)"
          Write-Host "INSTALL_LOCATION=$root"
          Write-Host "SIGNATURE_KIND=$($pkg.SignatureKind)"

          $manifest=Join-Path $root 'AppxManifest.xml'
          if(Test-Path $manifest) {
            Write-Host '=== MANIFEST RELEVANT LINES ==='
            Select-String -Path $manifest -Pattern 'Application|Executable|EntryPoint|Capability|Extension|Service|Protocol|RuntimeBehavior|TrustLevel|windows.' -CaseSensitive:$false |
              Select-Object -First 220 |
              ForEach-Object { Write-Host "MANIFEST=$($_.Line.Trim())" }
          }

          Write-Host '=== BINARY INVENTORY ==='
          $bins=Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.exe','.dll','.winmd' }
          Write-Host "BINARY_COUNT=$($bins.Count)"
          $bins | Sort-Object Length -Descending | Select-Object -First 180 | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length).TrimStart('\\')
            Write-Host "BIN=$rel SIZE=$($_.Length)"
          }

          Write-Host '=== RELEVANT PROCESS / SERVICE STATE ==='
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'Gaming|Xbox|Xbl' -or $_.PathName -match 'GamingServices' } |
            Select-Object Name,DisplayName,State,StartMode,PathName |
            Format-Table -AutoSize
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'gaming|xbox|xbl' -or $_.ExecutablePath -match 'GamingServices' } |
            Select-Object ProcessId,ParentProcessId,Name,ExecutablePath |
            Format-Table -AutoSize

          Write-Host '=== ACQUISITION STRING TARGETS ==='
          $needles=@(
            $env:BEDROCK_PRODUCT_ID,
            'StartProductInstallWithOptionsAsync',
            'StartProductInstall',
            'Windows.ApplicationModel.Store.Preview.InstallControl',
            'AppInstallManager',
            'Windows.Services.Store',
            'StoreContext',
            'XStore',
            'GamingServices',
            'Microsoft.GamingServices',
            'InstallService',
            'ClipSVC',
            'License',
            'Entitlement',
            'MSIXVC',
            'PackageManager',
            'WindowsUpdate',
            'wuapi',
            'UpdateSession',
            'IUpdateSession',
            'tlu.dl.delivery.mp.microsoft.com',
            '9PGW18NPBZV5'
          )

          function Contains-Bytes([byte[]]$haystack,[byte[]]$needle) {
            if($needle.Length -eq 0 -or $haystack.Length -lt $needle.Length){return $false}
            for($i=0;$i -le $haystack.Length-$needle.Length;$i++) {
              $ok=$true
              for($j=0;$j -lt $needle.Length;$j++) {
                if($haystack[$i+$j] -ne $needle[$j]){$ok=$false;break}
              }
              if($ok){return $true}
            }
            return $false
          }

          foreach($needle in $needles) {
            $ascii=[System.Text.Encoding]::ASCII.GetBytes($needle)
            $utf16=[System.Text.Encoding]::Unicode.GetBytes($needle)
            $matches=@()
            foreach($f in $bins) {
              try {
                $bytes=[System.IO.File]::ReadAllBytes($f.FullName)
                if((Contains-Bytes $bytes $ascii) -or (Contains-Bytes $bytes $utf16)) {
                  $matches += $f.FullName.Substring($root.Length).TrimStart('\\')
                }
              } catch {}
            }
            Write-Host "NEEDLE=$needle MATCH_FILE_COUNT=$($matches.Count)"
            $matches | Select-Object -First 80 | ForEach-Object { Write-Host "MATCH_FILE=$_" }
          }

          Write-Host '=== PE IMPORT CLUES ==='
          $dumpbin=Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Filter dumpbin.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if($dumpbin) {
            Write-Host "DUMPBIN=$($dumpbin.FullName)"
            $focus=$bins | Where-Object { $_.Name -match 'gamingservices|gamingservicesnet|xbox|store|install|license' } | Select-Object -First 30
            foreach($f in $focus) {
              $rel=$f.FullName.Substring($root.Length).TrimStart('\\')
              Write-Host "--- IMPORTS FILE=$rel ---"
              & $dumpbin.FullName /imports $f.FullName 2>$null |
                Select-String -Pattern 'store|appx|package|license|clip|winhttp|wininet|rpc|combase|windowsupdate|wuapi|xbox|gaming|xstore' -CaseSensitive:$false |
                Select-Object -First 120 |
                ForEach-Object { Write-Host "IMPORT=$($_.Line.Trim())" }
            }
          } else {
            Write-Host 'DUMPBIN_AVAILABLE=false'
          }

          Write-Host "FINAL_RESULT=Gaming Services was materialized by Microsoft's signed installer and statically inspected in place. No Microsoft sign-in was automated, no tokens were collected, no Store capability was forged, and no package payload was uploaded."
