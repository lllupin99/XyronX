name: Inspect modern Minecraft installer initial state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-initial-state:
    runs-on: windows-11-arm

    steps:
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:RUNNER_TEMP "minecraft-installer-initial-state"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $installer = Join-Path $root "MinecraftInstaller.exe"

          Invoke-WebRequest `
            -Uri "https://aka.ms/minecraftClientGameCoreWindows" `
            -OutFile $installer `
            -MaximumRedirection 10

          $sig = Get-AuthenticodeSignature $installer
          $hash = Get-FileHash $installer -Algorithm SHA256
          $file = Get-Item $installer

          Write-Host "=== OFFICIAL INSTALLER ==="
          Write-Host "SIZE=$($file.Length)"
          Write-Host "SHA256=$($hash.Hash)"
          Write-Host "SIGNATURE_STATUS=$($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Host "SIGNER=$($sig.SignerCertificate.Subject)"
          }

          if ($sig.Status -ne 'Valid') {
            throw "Installer signature is not valid; refusing to inspect it."
          }

          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSPECTION_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build targeted IL analyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tool = Join-Path $env:INSPECTION_ROOT "initial-state-analyzer"
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          Push-Location $tool

          dotnet new console --framework net8.0 --force | Out-Null
          dotnet add package Mono.Cecil --version 0.11.6 | Out-Null

          @'
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using Mono.Cecil;
          using Mono.Cecil.Cil;

          if (args.Length != 1)
          {
              Console.Error.WriteLine("Expected installer path.");
              return 2;
          }

          using var asm = AssemblyDefinition.ReadAssembly(args[0], new ReaderParameters { ReadSymbols = false });
          var module = asm.MainModule;

          static IEnumerable<TypeDefinition> AllTypes(IEnumerable<TypeDefinition> roots)
          {
              foreach (var type in roots)
              {
                  yield return type;
                  foreach (var nested in AllTypes(type.NestedTypes))
                      yield return nested;
              }
          }

          static string OperandText(object? operand) => operand switch
          {
              null => "",
              string s => $"\"{s.Replace("\r", "\\r").Replace("\n", "\\n")}\"",
              MethodReference m => m.FullName,
              FieldReference f => f.FullName,
              TypeReference t => t.FullName,
              Instruction i => $"IL_{i.Offset:X4}",
              Instruction[] a => string.Join(",", a.Select(i => $"IL_{i.Offset:X4}")),
              VariableDefinition v => v.ToString(),
              ParameterDefinition p => p.ToString(),
              _ => operand.ToString() ?? ""
          };

          static void DumpMethod(MethodDefinition method)
          {
              Console.WriteLine($"METHOD={method.FullName}");
              Console.WriteLine($"  STATIC={method.IsStatic} RETURN={method.ReturnType.FullName}");
              foreach (var p in method.Parameters)
                  Console.WriteLine($"  PARAM={p.Index}:{p.Name} TYPE={p.ParameterType.FullName}");

              if (!method.HasBody)
              {
                  Console.WriteLine("  <no body>");
                  return;
              }

              foreach (var local in method.Body.Variables)
                  Console.WriteLine($"  LOCAL={local.Index} TYPE={local.VariableType.FullName}");

              foreach (var eh in method.Body.ExceptionHandlers)
                  Console.WriteLine($"  EH={eh.HandlerType} TRY=IL_{eh.TryStart?.Offset:X4}-IL_{eh.TryEnd?.Offset:X4} HANDLER=IL_{eh.HandlerStart?.Offset:X4}-IL_{eh.HandlerEnd?.Offset:X4}");

              foreach (var ins in method.Body.Instructions)
                  Console.WriteLine($"  IL_{ins.Offset:X4}: {ins.OpCode} {OperandText(ins.Operand)}");
          }

          var allTypes = AllTypes(module.Types).ToList();

          Console.WriteLine("=== ASSEMBLY ===");
          Console.WriteLine(asm.Name.FullName);

          Console.WriteLine();
          Console.WriteLine("=== PAGETYPE ENUM ===");
          var pageType = allTypes.FirstOrDefault(t => t.FullName == "MinecraftInstaller.Helpers.PageType");
          if (pageType == null)
          {
              Console.WriteLine("PAGETYPE_NOT_FOUND");
          }
          else
          {
              Console.WriteLine($"TYPE={pageType.FullName} IS_ENUM={pageType.IsEnum}");
              foreach (var field in pageType.Fields.Where(f => f.IsStatic && f.HasConstant))
                  Console.WriteLine($"PAGE={field.Name} VALUE={field.Constant}");
          }

          Console.WriteLine();
          Console.WriteLine("=== INITIALSTATEHELPER FIELDS ===");
          var helper = allTypes.FirstOrDefault(t => t.FullName == "MinecraftInstaller.Helpers.InitialStateHelper");
          if (helper == null)
          {
              Console.WriteLine("INITIALSTATEHELPER_NOT_FOUND");
              return 3;
          }

          foreach (var field in helper.Fields)
          {
              var constant = field.HasConstant ? $" CONSTANT={field.Constant}" : "";
              Console.WriteLine($"FIELD={field.FullName}{constant}");
          }

          Console.WriteLine();
          Console.WriteLine("=== ALL INITIALSTATEHELPER METHODS ===");
          foreach (var method in helper.Methods)
          {
              DumpMethod(method);
              Console.WriteLine();
          }

          var findInitialState = helper.Methods.FirstOrDefault(m => m.Name == "FindInitialState");
          if (findInitialState == null || !findInitialState.HasBody)
          {
              Console.WriteLine("FIND_INITIAL_STATE_NOT_FOUND");
              return 4;
          }

          Console.WriteLine("=== FINDINITIALSTATE STRING LITERALS ===");
          foreach (var ins in findInitialState.Body.Instructions.Where(i => i.OpCode.Code == Code.Ldstr && i.Operand is string))
              Console.WriteLine($"LDSTR_AT_IL_{ins.Offset:X4}={(string)ins.Operand}");

          Console.WriteLine();
          Console.WriteLine("=== FINDINITIALSTATE CALLED METHODS ===");
          foreach (var mr in findInitialState.Body.Instructions
              .Select(i => i.Operand)
              .OfType<MethodReference>()
              .GroupBy(m => m.FullName)
              .Select(g => g.First()))
          {
              Console.WriteLine($"CALL={mr.FullName}");

              MethodDefinition? resolved = null;
              try { resolved = mr.Resolve(); } catch { }

              if (resolved != null && resolved.Module == module && resolved.HasBody &&
                  (resolved.DeclaringType.FullName.StartsWith("MinecraftInstaller.Helpers.", StringComparison.Ordinal) ||
                   resolved.DeclaringType.FullName.StartsWith("MinecraftInstaller.MainWindow", StringComparison.Ordinal)))
              {
                  Console.WriteLine("  --- RESOLVED INTERNAL METHOD ---");
                  DumpMethod(resolved);
                  Console.WriteLine("  --- END RESOLVED INTERNAL METHOD ---");
              }
          }

          Console.WriteLine();
          Console.WriteLine("=== INITIALIZEASYNC FULL IL ===");
          var initializeStateMachine = allTypes.FirstOrDefault(t => t.FullName.Contains("MinecraftInstaller.MainWindow/<InitializeAsync>d__", StringComparison.Ordinal));
          if (initializeStateMachine == null)
          {
              Console.WriteLine("INITIALIZE_ASYNC_STATE_MACHINE_NOT_FOUND");
          }
          else
          {
              foreach (var method in initializeStateMachine.Methods.Where(m => m.Name == "MoveNext" && m.HasBody))
                  DumpMethod(method);
          }

          Console.WriteLine();
          Console.WriteLine("=== CHANGE PAGE MAPPING SUPPORT ===");
          var mainWindow = allTypes.FirstOrDefault(t => t.FullName == "MinecraftInstaller.MainWindow");
          if (mainWindow != null)
          {
              foreach (var method in mainWindow.Methods.Where(m =>
                  m.HasBody && (m.Name == "ChangePage" || m.Name == "ChangeToErrorPage")))
              {
                  DumpMethod(method);
                  Console.WriteLine();
              }
          }

          Console.WriteLine("=== TARGETED INITIAL STATE INSPECTION COMPLETE ===");
          return 0;
          '@ | Set-Content -Path (Join-Path $tool "Program.cs") -Encoding UTF8

          dotnet build -c Release
          "INITIAL_STATE_ANALYZER=$tool" | Out-File -FilePath $env:GITHUB_ENV -Append
          Pop-Location

      - name: Analyze initial-state routing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:INITIAL_STATE_ANALYZER
          dotnet run -c Release --no-build -- $env:INSTALLER_PATH
          Pop-Location

      - name: Final marker
        shell: pwsh
        run: |
          Write-Host "=== INSPECTION COMPLETE ==="
          Write-Host "Static analysis only. MinecraftInstaller.exe was not executed."
          Write-Host "No Microsoft account was used."
          Write-Host "No Store entitlement was modified."
          Write-Host "No Minecraft or Launcher package was installed."
